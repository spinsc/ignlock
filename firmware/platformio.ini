; Sistema de Bloqueio e Liberação de Partida Veicular Inteligente
; Firmware ESP32 — PlatformIO project file

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

lib_deps =
    h2zero/NimBLE-Arduino @ ^1.4.1
    adafruit/RTClib @ ^2.1.1

build_flags =
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_BT_NIMBLE_MAX_CONNECTIONS=1

; Particionamento padrão (default.csv) é suficiente: usamos NVS (Preferences) nativo.
