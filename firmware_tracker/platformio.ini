; Módulo de Rastreamento IGNLOCK — ESP32 + SIM7600G-H (LTE + GNSS)
; Controlador independente do firmware de bloqueio (ver firmware/) — projeto
; PlatformIO separado de propósito, ver docs/08-modulo-rastreamento.md, A.4.1.

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

build_flags =
    -D CORE_DEBUG_LEVEL=3
